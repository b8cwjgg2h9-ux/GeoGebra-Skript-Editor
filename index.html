<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GeoGebra Skript-IDE</title>

    <script src="https://cdn.geogebra.org/apps/deployggb.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/javascript/javascript.min.js"></script>

    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        #ggb-container {
            height: 55vh;
            min-height: 450px;
            border-bottom: 2px solid #ccc;
            flex-shrink: 0;
        }

        #script-container {
            padding: 20px;
            background: #f8f9fa;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        #controls {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }

        button {
            padding: 10px 20px;
            font-size: 14px;
            cursor: pointer;
            background: #0066cc;
            color: white;
            border: none;
            border-radius: 4px;
            font-weight: bold;
        }

        button:hover {
            background: #0052a3;
        }

        button.clear-btn {
            background: #6c757d;
        }

        button.clear-btn:hover {
            background: #5a6268;
        }

        .CodeMirror {
            border: 1px solid #ced4da;
            border-radius: 4px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 15px;
            margin-bottom: 10px;
            height: auto;
            flex-grow: 1;
        }

        #error-log {
            color: #842029;
            background: #f8d7da;
            padding: 15px;
            border: 1px solid #f5c2c7;
            border-radius: 4px;
            display: none;
            font-family: monospace;
            white-space: pre-wrap;
            margin-top: 10px;
        }

        .syntax-suggestion {
            color: #055160;
            background: #cff4fc;
            padding: 10px;
            border-left: 4px solid #0dcaf0;
            margin-top: 5px;
            font-size: 13px;
        }
    </style>
</head>

<body>

    <div id="ggb-container"></div>

    <div id="script-container">
        <div id="controls">
            <button onclick="executeScript()">Skript ausführen</button>
            <button id="app-toggle-btn" class="clear-btn" onclick="toggleGeoGebraApp()">Zu Classic wechseln</button>
            <button class="clear-btn" onclick="clearScript()">Skript löschen</button>
            <button class="clear-btn" onclick="clearGeoGebra()">GeoGebra leeren</button>
            <span id="dict-status"
                style="line-height: 40px; margin-left: auto; color: #666; font-size: 13px;">Wörterbuch lädt...</span>
        </div>

        <textarea id="script-input">
A=Punkt({(0,0)})  
B=Punkt({(3,0)}) 
C=(2,2)          
V=Vieleck[A,B,C] 
ZeigeAchsen(1,false)
Winkel(A,C,B)

# Eigenschaften des Dreiecks:
SetzeFarbe(V,rot) 
SetzeBeschriftung(C,"Bewege mich!")
Liste={a,b,c}    
Ausführen( Folge("ShowLabel(" + Name(Element(Liste, i)) + ", false)", i, 1, Length(Liste)) ) 
        </textarea>

        <div id="error-log"></div>
    </div>

    <script>
        var ggbApplet;
        var editor;

        var commandDict = {};
        var germanCommands = [];
        var germanToEnglish = {};
        // Alle Befehlsnamen (englisch und deutsch, klein geschrieben) – auch die, deren deutscher
        // Name mit dem englischen übereinstimmt und daher keine eigene Übersetzungszeile hat.
        var allCommandNames = new Set();
        var commandRegexCache = {};

        var currentCommandFailed = false;
        var currentGeoGebraApp = "suite";
        var applet;

        window.myGeoGebraErrorHandler = function () {
            currentCommandFailed = true;
        };

        window.onload = function () {
            editor = CodeMirror.fromTextArea(document.getElementById("script-input"), {
                lineNumbers: true,
                mode: "javascript",
                theme: "default",
                matchBrackets: true
            });

            loadDictionary();
            injectGeoGebraApp();
        };

        function getAppletHeight() {
            return Math.max(window.innerHeight * 0.55, 450);
        }

        function createAppletParameters(appName) {
            return {
                "appName": appName,
                "width": window.innerWidth,
                "height": getAppletHeight(),
                "showToolBar": true,
                "showAlgebraInput": true,
                "showMenuBar": true,
                "language": "de",
                "useBrowserForJS": false,
                "errorDialogsActive": false,
                "appletOnLoad": function (api) {
                    ggbApplet = api;
                    // CAS vorwärmen: Die erste CAS-Rechnung nach dem Laden liefert sonst
                    // falsche Ergebnisse (z. B. leere Lösungsmenge bei Löse).
                    try { api.evalCommandCAS("1+1"); } catch (e) { }
                    window.onresize = function () {
                        api.setSize(window.innerWidth, getAppletHeight());
                    };
                }
            };
        }

        function updateAppToggleButton() {
            var button = document.getElementById("app-toggle-btn");
            if (!button) return;
            button.textContent = currentGeoGebraApp === "suite"
                ? "Zu Classic wechseln"
                : "Zu Suite wechseln";
        }

        function injectGeoGebraApp() {
            ggbApplet = null;
            currentCommandFailed = false;
            document.getElementById("ggb-container").outerHTML = '<div id="ggb-container"></div>';
            applet = new GGBApplet(createAppletParameters(currentGeoGebraApp), true);
            applet.inject("ggb-container");
            updateAppToggleButton();
        }

        function toggleGeoGebraApp() {
            currentGeoGebraApp = currentGeoGebraApp === "suite" ? "classic" : "suite";
            document.getElementById("error-log").style.display = "none";
            injectGeoGebraApp();
        }

        async function loadDictionary() {
            try {
                const response = await fetch('command_de.json');
                if (!response.ok) {
                    throw new Error("HTTP " + response.status);
                }
                const text = await response.text();
                parseProperties(text);
                document.getElementById('dict-status').innerHTML = "Wörterbuch geladen (" + germanCommands.length + " Befehle)";
            } catch (error) {
                document.getElementById('dict-status').innerHTML = "<span style='color:red;'>Fehler: command_de.json nicht gefunden! Bitte über lokalen Server ausführen.</span>";
            }
        }

        function parseProperties(text) {
            const lines = text.split('\n');
            let map = {};

            for (let line of lines) {
                line = line.trim();
                if (!line || line.startsWith('#')) continue;
                const eqIdx = line.indexOf('=');
                if (eqIdx > -1) {
                    const key = line.substring(0, eqIdx).trim();
                    const val = line.substring(eqIdx + 1).replace(/\\n/g, '\n').trim();
                    map[key] = val;
                }
            }

            for (let key in map) {
                allCommandNames.add(key.split('.')[0].toLowerCase());
                if (!key.includes('.')) {
                    allCommandNames.add(map[key].toLowerCase());
                    const englishCmd = key;
                    const germanCmd = map[key];

                    germanToEnglish[germanCmd] = englishCmd;
                    if (!germanCommands.includes(germanCmd)) {
                        germanCommands.push(germanCmd);
                    }

                    const syntax = map[englishCmd + '.Syntax'] || map[englishCmd + '.SyntaxCAS'];
                    if (syntax) {
                        commandDict[germanCmd.toLowerCase()] = {
                            german: germanCmd,
                            syntax: syntax.split('\n')
                        };
                    }
                }
            }
            germanCommands.sort((a, b) => b.length - a.length);

            for (let deCmd of germanCommands) {
                commandRegexCache[deCmd] = new RegExp("(^|[^a-zA-ZäöüÄÖÜß_])(" + deCmd + ")(?=\\s*[\\[\\(])", "g");
            }
        }

        function translateLineToEnglish(line) {
            let strings = [];
            let tempLine = line.replace(/"([^"\\]*(\\.[^"\\]*)*)"/g, function (match) {
                strings.push(match);
                return '"__STR_' + (strings.length - 1) + '__"';
            });

            for (let deCmd of germanCommands) {
                let engCmd = germanToEnglish[deCmd];
                let regex = commandRegexCache[deCmd];
                tempLine = tempLine.replace(regex, "$1" + engCmd);
            }

            for (let i = 0; i < strings.length; i++) {
                tempLine = tempLine.replace('"__STR_' + i + '__"', strings[i]);
            }

            return tempLine;
        }

        function isEscaped(text, index) {
            let backslashCount = 0;
            for (let i = index - 1; i >= 0 && text[i] === '\\'; i--) {
                backslashCount++;
            }
            return backslashCount % 2 === 1;
        }

        function escapeHtml(text) {
            return text
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        function stripComments(line) {
            let inString = false;
            for (let i = 0; i < line.length; i++) {
                if (line[i] === '"' && !isEscaped(line, i)) inString = !inString;
                if (!inString) {
                    if (line[i] === '#') return line.substring(0, i).trim();
                    if (i < line.length - 1 && line[i] === '/' && line[i + 1] === '/') {
                        return line.substring(0, i).trim();
                    }
                }
            }
            return line.trim();
        }

        function getLevenshteinDistance(a, b) {
            const matrix = [];
            for (let i = 0; i <= b.length; i++) { matrix[i] = [i]; }
            for (let j = 0; j <= a.length; j++) { matrix[0][j] = j; }
            for (let i = 1; i <= b.length; i++) {
                for (let j = 1; j <= a.length; j++) {
                    if (b.charAt(i - 1) == a.charAt(j - 1)) {
                        matrix[i][j] = matrix[i - 1][j - 1];
                    } else {
                        matrix[i][j] = Math.min(matrix[i - 1][j - 1] + 1, Math.min(matrix[i][j - 1] + 1, matrix[i - 1][j] + 1));
                    }
                }
            }
            return matrix[b.length][a.length];
        }

        function findBestMatches(inputCmd) {
            let matches = [];
            let lowerInput = inputCmd.toLowerCase();
            for (let cmd of germanCommands) {
                let lowerCmd = cmd.toLowerCase();
                let dist = getLevenshteinDistance(lowerInput, lowerCmd);
                if (dist <= 3 || lowerCmd.includes(lowerInput)) {
                    matches.push({ cmd: cmd, dist: dist });
                }
            }
            matches.sort((a, b) => a.dist - b.dist);
            return matches.slice(0, 3);
        }

        function extractCommandName(line) {
            let match = line.match(/(?:=\s*)?([A-Za-zÄÖÜäöüß]+)\s*[[(]/);
            return match ? match[1] : null;
        }

        function getAllArguments(cmdString) {
            let start = cmdString.search(/[[(]/);
            let end = Math.max(cmdString.lastIndexOf(')'), cmdString.lastIndexOf(']'));
            if (start === -1 || end === -1 || end <= start) return [];

            let argsString = cmdString.substring(start + 1, end);
            let args = [];
            let pCount = 0;
            let currentArg = "";
            let inString = false;

            for (let i = 0; i < argsString.length; i++) {
                let char = argsString[i];
                if (char === '"' && !isEscaped(argsString, i)) inString = !inString;

                if (!inString) {
                    if (char === '(' || char === '[' || char === '{') pCount++;
                    else if (char === ')' || char === ']' || char === '}') pCount--;
                    else if (char === ',' && pCount === 0) {
                        if (currentArg.trim() !== "") args.push(currentArg.trim());
                        currentArg = "";
                        continue;
                    }
                }
                currentArg += char;
            }
            if (currentArg.trim() !== "") {
                args.push(currentArg.trim());
            }
            return args;
        }

        async function waitForCas() {
            // Wartet höchstens 10 s, bis das CAS rechnet.
            for (let ms = 0; ms < 10000; ms += 250) {
                try { if (ggbApplet.evalCommandCAS("1+1") === "2") return true; } catch (e) { }
                await new Promise(r => setTimeout(r, 250));
            }
            return false;
        }

        async function executeScript() {
            var script = editor.getValue();
            if (typeof ggbApplet !== "undefined" && ggbApplet &&
                (currentGeoGebraApp === "classic" || /^\s*\$\d+\s*:/m.test(script))) {
                await waitForCas();
            }
            var casInfos = [];
            var errorLog = document.getElementById("error-log");
            errorLog.style.display = "none";
            errorLog.innerHTML = "";

            if (typeof ggbApplet === "undefined" || !ggbApplet) {
                alert("GeoGebra lädt noch. Bitte einen Moment Geduld.");
                return;
            }

            const scriptingCmds = [
                "CenterView", "Delete", "Execute", "GetTime", "Pan", "ParseToFunction", "ParseToNumber",
                "PlaySound", "Rename", "RunClickScript", "RunUpdateScript", "SelectObjects", "SetActiveView",
                "SetBackgroundColor", "SetCaption", "SetColor", "SetConditionToShowObject", "SetConstructionStep",
                "SetCoords", "SetDynamicColor", "SetFilling", "SetFixed", "SetLabelMode", "SetLayer", "SetLineStyle",
                "SetLineThickness", "SetPerspective", "SetPointSize", "SetPointStyle", "SetSeed", "SetSpinSpeed",
                "SetTooltipMode", "SetTrace", "SetValue", "SetViewDirection", "SetVisibleInView", "ShowAxes",
                "ShowGrid", "ShowLabel", "ShowLayer", "StartAnimation", "StartLogging", "StartRecord",
                "StopLogging", "UpdateConstruction", "ZoomIn", "ZoomOut", "Repeat"
            ];

            const ignorableConstants = [
                "true", "false", "pi", "e", "i", "x", "y", "z",
                "rot", "red", "grün", "green", "blau", "blue", "gelb", "yellow",
                "orange", "lila", "purple", "purpur", "cyan", "magenta",
                "schwarz", "black", "weiß", "weiss", "white", "grau", "gray",
                "grey", "braun", "brown", "pink", "rosa"
            ];

            var lines = script.split('\n');
            // Namen, die schon vor dem Skript existierten (z. B. beim zweiten Ausführen).
            const namesAtStart = new Set(ggbApplet.getAllObjectNames());
            var errorsHtml = "";

            ggbApplet.setRepaintingActive(false);
            try {
                for (var i = 0; i < lines.length; i++) {
                    var line = stripComments(lines[i]);
                    if (line.length === 0) continue;

                    var translatedLine = translateLineToEnglish(line);
                    let cmdMatch = translatedLine.match(/(?:=\s*)?([A-Za-z]+)\s*[[(]/);
                    let engCmd = cmdMatch ? cmdMatch[1] : null;
                    let isScriptingCmd = engCmd && scriptingCmds.includes(engCmd);

                    let args = isScriptingCmd ? getAllArguments(translatedLine) : [];
                    let variablesToCheck = [];

                    for (let arg of args) {
                        let isWord = /^[A-Za-zÄÖÜäöüß][A-Za-z0-9ÄÖÜäöüß_]*$/.test(arg);
                        let isKnownConstant = ignorableConstants.includes(arg.toLowerCase());

                        if (isWord && !isKnownConstant) {
                            variablesToCheck.push({
                                name: arg,
                                existedBefore: ggbApplet.exists(arg)
                            });
                        }
                    }

                    // CAS-Zellen werden nur angezeigt, wenn die CAS-Ansicht schon offen ist,
                    // bevor sie angelegt werden. Deshalb vor jeder $-Zeile öffnen.
                    if (currentGeoGebraApp === "classic" && /^\s*\$\d+\s*:/.test(translatedLine)) {
                        if (ensureCasView()) casInfos.push("CAS-Ansicht wurde geöffnet.");
                    }

                    currentCommandFailed = false;
                    const lineTarget = assignmentTarget(translatedLine);
                    const targetExistedBefore = !!(lineTarget && ggbApplet.exists(lineTarget.name));
                    // GeoGebra löscht beim Versuch, ein abhängiges Objekt neu zu definieren, unter Umständen das
                    // Objekt, zu dem es gehört (G=(3,3,3) nach Würfel(A,B,C) löscht den Würfel). Solche Zeilen
                    // werden deshalb gar nicht erst ausgeführt, wenn der Name erst in diesem Skript entstanden ist.
                    if (targetExistedBefore && !namesAtStart.has(lineTarget.name) &&
                        !ggbApplet.isIndependent(lineTarget.name) && !casRowForLabel(lineTarget.name)) {
                        errorsHtml += `<strong>Fehler in Zeile ${i + 1}:</strong> <code>${escapeHtml(lines[i].trim())}</code><br>`;
                        errorsHtml += `<div class="syntax-suggestion">${escapeHtml(nameClashMessage(lineTarget.name))}</div>`;
                        errorsHtml += "<hr style='border: 0; border-bottom: 1px solid #f5c2c7; margin: 15px 0;'>";
                        continue;
                    }
                    var objectsBefore = ggbApplet.getObjectNumber();
                    var success = ggbApplet.evalCommand(translatedLine);
                    var objectsCreated = ggbApplet.getObjectNumber() > objectsBefore;

                    // CAS-Zeilen ($n: ...) erzeugen nicht immer ein Algebra-Objekt; evalCommand
                    // liefert dafuer immer false. Erfolg wird an der Ausgabe der CAS-Zelle gemessen.
                    let casMatch = translatedLine.match(/^\s*\$(\d+)\s*:/);
                    let casMessage = "";
                    if (casMatch) {
                        let casCheck = checkCasCell(parseInt(casMatch[1], 10), translatedLine);
                        success = casCheck.ok;
                        casMessage = casCheck.message;
                        currentCommandFailed = !casCheck.ok;
                    }

                    let missingObjectError = false;
                    for (let v of variablesToCheck) {
                        let existsAfter = ggbApplet.exists(v.name);
                        if (!v.existedBefore && !existsAfter) {
                            missingObjectError = true;
                            break;
                        }
                    }

                    // Automatische CAS-Umleitung (nur Classic): Eine Zeile ohne $, die in der
                    // Algebra-Eingabe scheitert oder ihr Objekt nicht anlegt, wird als CAS-Zelle
                    // gerechnet – z. B. Löse mit Parametern, Ersetze, Wendepunkt bei e-Funktionen.
                    if (!casMatch && !isScriptingCmd && currentGeoGebraApp === "classic") {
                        const target = assignmentTarget(translatedLine);
                        // Gescheitert, oder ohne jedes neue Objekt (z. B. Wendepunkt bei e-Funktionen).
                        // Mehrfachergebnisse wie N=Nullstelle(f) legen N_1, N_2 an – das gilt als Erfolg.
                        const missed = !success || currentCommandFailed ||
                            (target && !ggbApplet.exists(target.name) && !objectsCreated);
                        // Namenskonflikt: Der Name wurde weiter oben im Skript schon vergeben, oft automatisch
                        // (Ecken eines Würfels, Seiten eines Vielecks). Nicht ins CAS umleiten und nichts löschen.
                        const nameClash = missed && target && targetExistedBefore && !namesAtStart.has(target.name);
                        if (nameClash) {
                            casMessage = nameClashMessage(target.name);
                            currentCommandFailed = true;
                        } else if (missed && !unknownName(target ? target.rhs : translatedLine)) {
                            const routed = routeToCas(translatedLine, target, casInfos);
                            if (routed.ok) {
                                success = true;
                                currentCommandFailed = false;
                                missingObjectError = false;
                                let note = "";
                                if (target && !ggbApplet.exists(target.name)) {
                                    note = " – bleibt im CAS, weil freie Parameter vorkommen";
                                }
                                casInfos.push(`Zeile ${i + 1} → CAS-Zelle $${routed.row}: <code>${escapeHtml(lines[i].trim())}</code>${note}`);
                            } else if (routed.message) {
                                casMessage = routed.message;
                                currentCommandFailed = true;
                            }
                        }
                    }

                    if (currentCommandFailed || missingObjectError || (!success && !isScriptingCmd)) {
                        errorsHtml += `<strong>Fehler in Zeile ${i + 1}:</strong> <code>${escapeHtml(lines[i].trim())}</code><br>`;
                        if (casMessage) {
                            errorsHtml += `<div class="syntax-suggestion">${escapeHtml(casMessage)}</div>`;
                            errorsHtml += "<hr style='border: 0; border-bottom: 1px solid #f5c2c7; margin: 15px 0;'>";
                            continue;
                        }

                        let originalCmdMatch = extractCommandName(line);
                        if (originalCmdMatch && germanCommands.length > 0) {
                            let suggestions = findBestMatches(originalCmdMatch);

                            if (suggestions.length > 0) {
                                errorsHtml += `<div class="syntax-suggestion"><strong>Meintest du vielleicht:</strong><br>`;
                                suggestions.forEach(s => {
                                    if (commandDict[s.cmd.toLowerCase()]) {
                                        let syntaxInfo = commandDict[s.cmd.toLowerCase()].syntax;
                                        errorsHtml += `<br><b>${escapeHtml(s.cmd)}</b><br>`;
                                        syntaxInfo.forEach(vari => {
                                            errorsHtml += `↳ ${escapeHtml(s.cmd)}${escapeHtml(vari)}<br>`;
                                        });
                                    }
                                });
                                errorsHtml += `</div>`;
                            } else {
                                errorsHtml += `<div class="syntax-suggestion">Objekt existiert nicht, Kontextfehler oder unbekannter Befehl im aktuellen Modus.</div>`;
                            }
                        } else {
                            errorsHtml += `<div class="syntax-suggestion">Mathematischer Fehler oder unbekanntes Objekt.</div>`;
                        }
                        errorsHtml += "<hr style='border: 0; border-bottom: 1px solid #f5c2c7; margin: 15px 0;'>";
                    }
                }
            } finally {
                ggbApplet.setRepaintingActive(true);
            }

            if (errorsHtml !== "") {
                errorLog.innerHTML = errorsHtml;
                errorLog.style.display = "block";
            }
            showCasInfo(casInfos);
        }

        function showCasInfo(infos) {
            let box = document.getElementById("cas-info");
            if (!box) {
                box = document.createElement("div");
                box.id = "cas-info";
                box.style.cssText = "display:none;margin:10px 0;padding:10px 14px;border:1px solid #9ec5fe;" +
                    "background:#e7f1ff;color:#052c65;border-radius:6px;font-size:14px;line-height:1.5";
                const log = document.getElementById("error-log");
                log.parentNode.insertBefore(box, log.nextSibling);
            }
            if (!infos || infos.length === 0) {
                box.style.display = "none";
                box.innerHTML = "";
                return;
            }
            box.innerHTML = "<strong>Im CAS gerechnet</strong> (die Algebra-Eingabe kann diese Zeilen nicht rechnen):<br>" +
                infos.join("<br>");
            box.style.display = "block";
        }

        function assignmentTarget(line) {
            // name = … oder name(x, …) = … ; x, y, z sind Gleichungen, keine Zuweisungen
            const m = line.match(/^\s*([A-Za-z][A-Za-z0-9]*(?:_\{[^}]*\}|_[A-Za-z0-9]+)?)\s*(\([^()]*\))?\s*=(?!=)\s*(.+)$/);
            if (!m || ["x", "y", "z"].includes(m[1])) return null;
            return { name: m[1], args: m[2] || "", rhs: m[3] };
        }

        function casCells() {
            return [...ggbApplet.getXML().matchAll(/<cascell[\s\S]*?<\/cascell>/g)].map(m => m[0]);
        }

        function unknownName(expr) {
            // Liefert den ersten Namen vor "(", der weder Befehl noch Funktion noch definiert ist.
            const builtins = ["sin", "cos", "tan", "cot", "sec", "csc", "arcsin", "arccos", "arctan", "asin", "acos", "atan",
                "sinh", "cosh", "tanh", "exp", "ln", "log", "lg", "ld", "sqrt", "cbrt", "nroot", "abs", "sgn", "sign",
                "floor", "ceil", "round", "random", "gamma", "beta", "erf", "real", "imaginary", "conjugate", "arg",
                "x", "y", "z", "fractionalPart"];
            const defined = new Set(casCells().map(c => ((c.match(/<inputCell>\s*<expression value="\s*([A-Za-z][A-Za-z0-9_{}]*)\s*\([^"]*:=/) || [])[1])).filter(Boolean));
            const names = [...expr.matchAll(/([A-Za-zÄÖÜäöüß][A-Za-z0-9ÄÖÜäöüß_]*)\s*\(/g)].map(m => m[1]);
            for (const n of names) {
                const ok = allCommandNames.has(n.toLowerCase()) || builtins.includes(n) || ggbApplet.exists(n) || defined.has(n);
                if (!ok) return n;
            }
            return null;
        }

        function ensureCasView() {
            // Öffnet die CAS-Ansicht (Kürzel C) zusätzlich zu den offenen Ansichten.
            // Rückgabe true, wenn sie gerade erst geöffnet wurde.
            let xml = "";
            try { xml = ggbApplet.getPerspectiveXML(); } catch (e) { return false; }
            const visible = [...xml.matchAll(/<view id="(\d+)"[^>]*visible="true"/g)].map(m => m[1]);
            if (visible.includes("8")) return false;
            const letters = { "1": "G", "2": "A", "4": "S", "16": "D", "32": "L", "64": "B", "512": "T" };
            const current = visible.map(id => letters[id] || "").join("");
            ggbApplet.setPerspective((current || "AG") + "C");
            return true;
        }

        function casRowForLabel(name) {
            // Zeilennummer einer vorhandenen CAS-Zelle mit diesem Namen, sonst 0.
            const cells = casCells();
            for (let k = 0; k < cells.length; k++) {
                const label = (cells[k].match(/caslabel="([^"]*)"/) || [])[1];
                if (label === name) return k + 1;
            }
            return 0;
        }

        function nameClashMessage(name) {
            return `Der Name ${name} ist schon vergeben – vermutlich hat ein Befehl weiter oben ihn automatisch angelegt ` +
                `(z. B. die Ecken eines Würfels oder die Seiten eines Vielecks). Einen anderen Namen wählen ` +
                `oder das vorhandene Objekt direkt verwenden.`;
        }

        function functionVariable(probe, target) {
            // Ist das CAS-Ergebnis ein Ausdruck in genau einer freien Variablen (x, t, s, …),
            // wird es als Funktion dieser Variablen zugewiesen, damit es gezeichnet wird.
            if (!target || target.args || /^[{(]/.test(probe) || probe.includes("=")) return null;
            if (/(^|[^A-Za-z_])x([^A-Za-z_(]|$)/.test(probe)) return "x";
            const letters = [...probe.matchAll(/(?:^|[^A-Za-z_])([a-df-hj-wA-Z])(?=[^A-Za-z_(]|$)/g)].map(m => m[1]);
            const free = [...new Set(letters)].filter(v => !ggbApplet.exists(v));
            return free.length === 1 ? free[0] : null;
        }

        function routeToCas(translatedLine, target, casInfos) {
            const rhs = target ? target.rhs : translatedLine.trim();
            let probe;
            try { probe = String(ggbApplet.evalCommandCAS(rhs) || "").trim(); } catch (e) { probe = ""; }
            if (probe === "" || probe === "?" || /NaN/.test(probe) || /Überprüfen|Fehler|error/i.test(probe)) {
                return { ok: false, message: "" };
            }
            if (/^\{\s*\}$/.test(probe)) {
                return { ok: false, message: "Auch im CAS ergibt sich die leere Menge {} – Ansatz prüfen (Tippfehler, Parameter e, zu viele oder zu wenige Bedingungen)." };
            }
            let input = rhs;
            if (target) {
                let lhs = target.name + target.args;
                // Ein Ausdruck in x wird als Funktion zugewiesen, damit er gezeichnet wird.
                const fvar = functionVariable(probe, target);
                if (fvar) lhs = target.name + "(" + fvar + ")";
                input = lhs + ":=" + rhs;
                if (ggbApplet.exists(target.name)) {
                    // Nur eigene Objekte ersetzen: ein abhängiges Objekt (z. B. die Ecke G eines Würfels)
                    // zu löschen, würde das Objekt, zu dem es gehört, mitlöschen.
                    if (!casRowForLabel(target.name) && !ggbApplet.isIndependent(target.name)) {
                        return { ok: false, message: nameClashMessage(target.name) };
                    }
                    ggbApplet.deleteObject(target.name);
                }
            }
            if (ensureCasView() && casInfos) casInfos.push("CAS-Ansicht wurde geöffnet.");
            // Gibt es schon eine CAS-Zelle mit diesem Namen (z. B. beim zweiten Ausführen),
            // wird sie überschrieben statt eine neue anzulegen – sonst benennt GeoGebra um.
            const row = (target && casRowForLabel(target.name)) || casCells().length + 1;
            const casLine = "$" + row + ": " + input;
            ggbApplet.evalCommand(casLine);
            const check = checkCasCell(row, casLine);
            return { ok: check.ok, message: check.message, row: row, input: input };
        }

        function checkCasCell(row, translatedLine) {
            // Liest die CAS-Zelle Nummer row aus dem Konstruktions-XML und bewertet ihre Ausgabe.
            const xml = ggbApplet.getXML();
            const cells = [...xml.matchAll(/<cascell[\s\S]*?<\/cascell>/g)].map(m => m[0]);
            if (row < 1 || row > cells.length) {
                return { ok: false, message: `CAS-Zelle $${row} wurde nicht angelegt. Zellen lückenlos ab $1 nummerieren.` };
            }
            const cell = cells[row - 1];
            const out = cell.match(/<outputCell>\s*<expression value="([^"]*)"([^>]*)>/);
            if (!out) {
                return { ok: false, message: "CAS-Zelle ohne Ergebnis – Syntaxfehler (z. B. fehlende Klammer)." };
            }
            const value = out[1].trim();
            const result = value.includes(":=") ? value.split(":=").slice(1).join(":=").trim() : value;
            if (/error="true"/.test(out[2]) || result === "" || result === "?" || /NaN/.test(result)) {
                return { ok: false, message: `CAS-Zelle liefert keinen gültigen Wert (${result || "leer"}).` };
            }
            if (/^\{\s*\}$/.test(result)) {
                return { ok: false, message: "CAS-Zelle liefert die leere Menge {} – Ansatz prüfen (Tippfehler, Parameter e, zu viele oder zu wenige Bedingungen)." };
            }
            // Unbekannte Befehle meldet das CAS nicht als Fehler, sondern gibt sie unverändert
            // oder als Produkt zurück (Foo(3) -> Foo * 3). Deshalb jeden Namen vor "(" prüfen.
            const body = translatedLine.replace(/^\s*\$\d+\s*:/, "");
            const rhs = body.includes(":=") ? body.split(":=").slice(1).join(":=") : body;
            const unknown = unknownName(rhs);
            if (unknown) {
                return { ok: false, message: `„${unknown}“ ist weder ein GeoGebra-Befehl noch eine definierte Funktion. Das CAS meldet das nicht selbst, das Ergebnis ist unbrauchbar.` };
            }
            if (/:=/.test(body) && /^\s*[A-Za-z]/.test(body)) {
                const label = (cell.match(/caslabel="([^"]*)"/) || [])[1];
                const wanted = body.split(":=")[0].replace(/\(.*$/, "").trim();
                if (label && wanted && label !== wanted) {
                    return { ok: false, message: `Name „${wanted}“ ist schon vergeben; das CAS hat die Zuweisung in „${label}“ umbenannt.` };
                }
            }
            return { ok: true, message: "" };
        }

        function clearScript() {
            editor.setValue("");
            document.getElementById("error-log").style.display = "none";
        }

        function clearGeoGebra() {
            if (typeof ggbApplet !== "undefined" && ggbApplet) {
                ggbApplet.newConstruction();
                document.getElementById("error-log").style.display = "none";
                showCasInfo([]);
            }
        }
    </script>
</body>
